<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin | Featured Google Reviews</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="thanks">
    <div class="thanks-card">
      <h1>Admin: feature Google reviews</h1>
      <p class="muted">Enter your admin password and select which reviews to feature on the website.</p>

      <label style="display:flex; flex-direction:column; gap:6px; font-weight:900;">
        Admin password
        <input id="pw" type="password" autocomplete="current-password" />
      </label>

      <!-- Optional Turnstile: add site key if you enable Turnstile -->
      <div style="margin-top:12px;">
        <div class="cf-turnstile" data-sitekey=""></div>
      </div>

      <div class="cta-row" style="margin-top:12px;">
        <button class="btn btn-primary" id="load">Load latest Google reviews</button>
      </div>

      <div id="list" style="margin-top:14px;"></div>

      <p class="muted" id="status" style="margin-top:12px;"></p>
    </div>
  </main>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const list = document.getElementById("list");
    const statusEl = document.getElementById("status");
    const pw = document.getElementById("pw");

    document.getElementById("load").addEventListener("click", async () => {
      statusEl.textContent = "Loading…";
      list.innerHTML = "";

      try {
        const res = await fetch("/api/reviews/admin-list", {
          headers: { "X-Admin-Password": pw.value }
        });

        if (!res.ok) throw new Error("Unauthorized or not configured");
        const data = await res.json();

        if (!data.ok || !Array.isArray(data.reviews)) throw new Error("No reviews data");

        const items = data.reviews.map(r => `
          <div style="border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-top:10px;background:#fff;">
            <div style="font-weight:1000;">${escapeHtml(r.author_name)} • ${"★★★★★".slice(0,r.rating)}${"☆☆☆☆☆".slice(0,5-r.rating)}</div>
            <div style="color:#5b6474;font-weight:800;font-size:12px;margin-top:4px;">${escapeHtml(r.relative_time_description || "")}</div>
            <div style="margin-top:10px;color:#0b1220;opacity:0.92;">${escapeHtml(r.text || "")}</div>
            <div style="margin-top:10px;">
              <button class="btn btn-primary" data-hash="${r.hash}">Feature this review</button>
            </div>
          </div>
        `).join("");

        list.innerHTML = items;
        statusEl.textContent = "Select reviews to feature.";

        list.querySelectorAll("button[data-hash]").forEach(btn => {
          btn.addEventListener("click", async () => {
            const hash = btn.getAttribute("data-hash");
            const token = document.querySelector('textarea[name="cf-turnstile-response"]')?.value || "";

            statusEl.textContent = "Saving…";
            const resp = await fetch("/api/reviews/approve", {
              method: "POST",
              headers: { "Content-Type":"application/json" },
              body: JSON.stringify({ password: pw.value, hash, turnstileToken: token })
            });

            const out = await resp.json().catch(() => ({}));
            statusEl.textContent = out.ok ? "Saved. That review can now appear on the site." : "Could not save (check password/Turnstile/server config).";
          });
        });

      } catch (e) {
        statusEl.textContent = "Admin not configured, unauthorized, or Google reviews not set up yet.";
      }
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
      }[c]));
    }
  </script>
</body>
</html>
